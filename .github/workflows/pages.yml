# Publica o site no GitHub Pages com as URLs de CSS/JS carimbadas (?v=<commit>),
# para quem volta ao site nunca misturar módulos novos com módulos em cache.
#
# Requer, uma vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Montar _site otimizado (CSS/JS empacotados) com versão carimbada
        run: |
          mkdir _site
          cp -r index.html assets css js _site/
          node tools/optimize-build.mjs _site
          node tools/stamp-version.mjs _site "$(git rev-parse --short HEAD)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
