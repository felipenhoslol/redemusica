# Gera o APK do app Android (Capacitor) a cada push na main e publica como Release "latest".
# O site descobre a versão pela API do GitHub (releases/latest) e baixa por:
#   https://github.com/<dono>/<repo>/releases/latest/download/rede-de-musica.apk
#
# Requer, uma vez, os secrets do repositório (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON_BASE64 (opcional: liga as notificações push; veja docs/push-setup.md)
# Sem eles o workflow não falha: gera um APK de debug como artefato e não publica Release.
name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Versão
        id: ver
        run: |
          echo "name=$(node -p "require('./package.json').version").${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "min=$(node -p "require('./package.json').minVersionCode || 1")" >> "$GITHUB_OUTPUT"

      # Firebase (avisos com o app fechado). Sem o secret, o APK sai igual, só sem avisos.
      - name: google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON_BASE64 ausente: APK sem notificações push."
          else
            echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
          fi

      - name: Montar www/ e sincronizar com o projeto Android
        run: |
          npm ci
          node tools/build-app.mjs "$VERSION_CODE" "${{ steps.ver.outputs.name }}"
          npx cap sync android

      - name: Keystore
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secrets do keystore ausentes: gerando APK de debug, sem Release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: APK assinado (release)
        if: steps.ks.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode="$VERSION_CODE" -PversionName="${{ steps.ver.outputs.name }}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/rede-de-musica.apk"
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: APK de debug (sem keystore)
        if: steps.ks.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode="$VERSION_CODE" -PversionName="${{ steps.ver.outputs.name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/rede-de-musica.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rede-de-musica-${{ steps.ver.outputs.name }}
          path: rede-de-musica.apk

      # O corpo da Release leva a versão em JSON: o site lê pela API (que tem CORS liberado)
      - name: Publicar Release
        if: steps.ks.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.ver.outputs.name }}
          MIN: ${{ steps.ver.outputs.min }}
        run: |
          printf 'App Android da rede de música sem nome.\n\n<!-- app-version {"version":"%s","versionCode":%s,"minVersionCode":%s} -->\n' \
            "$NAME" "$VERSION_CODE" "$MIN" > notes.md
          gh release create "v$NAME" rede-de-musica.apk --target "$GITHUB_SHA" --title "App $NAME" --notes-file notes.md --latest
